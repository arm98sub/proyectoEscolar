{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto py-12 px-4"><div class="bg-white border border-rose-200 rounded-2xl p-7 shadow-sm">
  <h1 class="text-2xl font-bold text-rose-700">Confirmar eliminación</h1><p class="mt-4">Vas a eliminar {{ tipo }} <strong>{{ objeto }}</strong>.</p><p class="mt-3 text-sm text-rose-700">{{ advertencia }}</p>
  <form method="post" class="flex justify-end gap-3 mt-7">{% csrf_token %}<a href="{% url volver %}" class="px-4 py-2 border rounded-xl">Cancelar</a><button class="px-4 py-2 bg-rose-600 text-white font-bold rounded-xl">Sí, eliminar</button></form>
</div></div>
{% endblock %}
