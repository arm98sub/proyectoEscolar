{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto py-8 px-4"><div class="bg-white border rounded-2xl p-6 shadow-sm">
  <h1 class="text-2xl font-bold mb-5">{{ titulo }}</h1>
  <form method="post" class="space-y-4">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div><label class="block text-sm font-bold mb-1">{{ field.label }}</label>{{ field }}{% if field.help_text %}<p class="text-xs text-slate-500 mt-1">{{ field.help_text }}</p>{% endif %}{{ field.errors }}</div>{% endfor %}<div class="flex justify-end gap-3 pt-3"><a href="{% url volver %}" class="px-4 py-2 border rounded-xl">Cancelar</a><button class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl">Guardar cambios</button></div></form>
</div></div>
{% endblock %}
