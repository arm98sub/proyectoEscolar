<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Tarea Encargada</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <main class="max-w-xl mx-auto px-4 py-12">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8">
            <h1 class="text-xl font-bold text-gray-900 mb-1">Editar Tarea Encargada</h1>
            <p class="text-xs text-gray-500 mb-6">Grupo: <span class="font-semibold text-indigo-600">{{ tarea.grupo.grado }}°{{ tarea.grupo.seccion }}</span></p>

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-2">Materia</label>
                    <select name="materia" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm">
                        {% for mat in materias %}
                            <option value="{{ mat.id }}" {% if mat.id == tarea.materia.id %}selected{% endif %}>
                                {{ mat.nombre }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-2">Título de la Tarea</label>
                    <input type="text" name="titulo" value="{{ tarea.titulo }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm" required>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
                    <a href="{% url 'lista_tareas_encargadas' %}" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</a>
                    <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
