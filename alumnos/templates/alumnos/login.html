<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Proyecto Escuela</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans antialiased">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-[#1B365D]">Bienvenido de nuevo</h2>
            <p class="text-sm text-gray-500 mt-1">Ingresa tus credenciales para acceder al panel docente.</p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-600 text-xs font-semibold p-3 rounded-lg mb-4 text-center">
            ❌ {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Usuario</label>
                <input type="text" name="username" required placeholder="Ej: maestro_alan" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <button type="submit" class="w-full bg-[#1B365D] hover:bg-blue-900 text-white font-medium py-2 rounded-lg text-sm transition-colors cursor-pointer mt-2">
                🚀 Entrar al Sistema
            </button>
        </form>
    </div>

</body>
</html>
