{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Colegio del Centro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center font-sans antialiased">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <img src="{% static 'alumnos/img/escudo-colegio-del-centro.png' %}" alt="Escudo del Colegio del Centro" class="h-20 w-auto mx-auto mb-4">
            <h2 class="text-2xl font-bold text-[#002147]">Bienvenido de nuevo</h2>
            <p class="text-sm text-gray-500 mt-1">Ingresa tus credenciales para acceder a Mi panel.</p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-600 text-xs font-semibold p-3 rounded-lg mb-4 text-center">
            ❌ {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Usuario</label>
                <input type="text" name="username" required placeholder="Ej: maestro_alan" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Contraseña</label>
                <div class="relative">
                    <input id="password" type="password" name="password" required placeholder="••••••••" class="w-full px-3 py-2 pr-20 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 px-3 text-xs font-bold text-[#002147] hover:text-[#00162f]" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
                </div>
            </div>
            <button type="submit" class="w-full bg-[#002147] hover:bg-[#00162f] text-white font-medium py-2 rounded-lg text-sm transition-colors cursor-pointer mt-2">
                🚀 Entrar al Sistema
            </button>
        </form>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('toggle-password');
        passwordToggle.addEventListener('click', () => {
            const visible = passwordInput.type === 'text';
            passwordInput.type = visible ? 'password' : 'text';
            passwordToggle.textContent = visible ? 'Mostrar' : 'Ocultar';
            passwordToggle.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
            passwordToggle.setAttribute('aria-pressed', String(!visible));
        });
    </script>

</body>
</html>
