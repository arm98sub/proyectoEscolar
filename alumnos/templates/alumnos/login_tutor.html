<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Tutores - Consulta Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

   <form method="POST" class="space-y-5">
    {% csrf_token %}
    <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
            Usuario
        </label>
        <input type="text" name="username" id="username" autocomplete="username" required
               class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none font-mono text-sm tracking-wide bg-gray-50">
    </div>

    <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Contraseña</label>
        <input type="password" name="password" autocomplete="current-password" required
               class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-600 focus:border-transparent outline-none text-sm bg-gray-50">
    </div>

    <button type="submit" class="w-full bg-[#1B365D] hover:bg-blue-900 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all cursor-pointer">
        Consultar Tablero
    </button>
</form>
    </div>

</body>
</html>
