<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <nav class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="{% url 'dashboard_maestro' %}" class="font-bold text-lg tracking-wide">
                Control Escolar
            </a>

            <div class="flex items-center gap-4 text-sm font-medium">
                {% if user.is_authenticated %}
                    {% if user.is_superuser or user.is_staff %}
                        <a href="{% url 'admin_dashboard' %}" class="hover:text-indigo-200 transition">
                            Panel administrativo
                        </a>
                        <a href="{% url 'registrar_maestro' %}" class="hover:text-indigo-200 transition">
                            + Maestros
                        </a>
                        <a href="{% url 'registrar_materia' %}" class="hover:text-indigo-200 transition">
                            + Materias
                        </a>
                    {% endif %}

                    <a href="{% url 'dashboard_maestro' %}" class="hover:text-indigo-200 transition">
                        Dashboard
                    </a>

                    <span class="bg-indigo-800 px-3 py-1 rounded-full text-xs">
                        {{ user.username }}
                    </span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="hover:text-indigo-200 transition">Salir</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
