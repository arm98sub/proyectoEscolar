services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=school_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret_password

  web:
    build: .
    volumes:
      - .:/code
      - venv_data:/code/.venv
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://admin:secret_password@db:5432/school_db
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=django-insecure-local-docker-only
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,testserver
    depends_on:
      - db

volumes:
  postgres_data:
  venv_data:
